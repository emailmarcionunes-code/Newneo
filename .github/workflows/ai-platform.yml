name: AI Platform
on:
  push:
    branches: [newneo-ai-platform-v1]
    paths: ['ai-platform/**', '.github/workflows/ai-platform.yml']
  pull_request:
    paths: ['ai-platform/**', '.github/workflows/ai-platform.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-platform/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-platform-browser-results
          path: |
            ai-platform/playwright-report/
            ai-platform/test-results/
          retention-days: 14
